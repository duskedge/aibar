name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 版本号（如 v0.5.0）
        required: true

jobs:
  release:
    name: 构建 · 发布
    runs-on: macos-15
    permissions:
      contents: write
    # 没配签名 Secret 也能发布，只是产出未签名包。
    # 步骤级的 `if:` 读不到步骤自己的 env，所以在 job 级把有没有证书算成布尔量。
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 版本号
        id: ver
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 构建
        run: ./scripts/build-app.sh

      # 需要仓库 Secrets。没配就跳过，产出未签名包 ——
      # 用户首次打开需要「右键 → 打开」，Release 说明里会写清楚。
      - name: 导入签名证书
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 签名与公证
        if: steps.signing.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/sign-and-notarize.sh .build/manual/aibar.app

      - name: 打 DMG
        run: ./scripts/make-dmg.sh .build/manual/aibar.app "${{ steps.ver.outputs.tag }}"

      # 未签名包必须在 Release 里说清楚怎么打开，否则用户只会看到
      # "已损坏，无法打开" 这种误导性提示。
      - name: 组装发布说明
        id: notes
        run: |
          {
            echo "notes<<EOF"
            cat .github/release-notes.md
            if [ "$HAS_SIGNING" != "true" ]; then
              cat .github/release-notes-unsigned.md
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: dist/*.dmg
          generate_release_notes: true
          body: ${{ steps.notes.outputs.notes }}
